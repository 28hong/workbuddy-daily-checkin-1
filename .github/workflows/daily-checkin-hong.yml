name: WorkBuddy Daily Checkin - Hong

on:
  schedule:
    - cron: "5 0 * * *"   # UTC 00:05 = 北京时间 08:05（与鸵鸟错开 5 分钟）
  workflow_dispatch: {}    # 允许在 GitHub 网页手动触发

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run checkin
        env:
          WORKBUDDY_ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS_HONG }}
        run: python daily_checkin.py
